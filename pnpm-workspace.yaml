# Two different jobs share this key, so they are labelled rather than left to be
# inferred. Note that pnpm re-serialises this file whenever it writes a setting
# of its own, and that drops every comment below — if they vanish after an
# install, restore them rather than assuming someone deleted them on purpose.
overrides:
  # A transitive dependency pinned forward past a published advisory. akahu 2.5.1
  # depends on uuid ^8.3.2 (GHSA-w5hq-g745-h8pq: missing bounds check on the
  # optional buf argument to v3/v5/v6), and akahu is already on its latest release,
  # so there is nothing to upgrade to at the top level — the fix has to be forced
  # here. akahu only calls uuid.v4() for its Idempotency-Key, so it never reached
  # the bug; this is hygiene, not a live fix. Held at 11.x deliberately: akahu does
  # require('uuid'), and uuid 13+ is ESM-only. The floor is 11.1.1 because the same
  # advisory covers uuid 12.0.0 and 13.0.0.
  akahu>uuid: ^11.1.1
  # Not advisories — deduplication, added by the Next 16 upgrade. Half the UI tree
  # (base-ui, the radix packages under shadcn) declares @types/react as a peer with
  # a range like ^18 || ^19, and pnpm is free to satisfy those with copies that are
  # not the one the app compiles against. Two copies of the React types in one tree
  # do not merge: JSX.Element from one is not assignable to JSX.Element from the
  # other, and tsc reports it at the call site rather than at the duplicate. These
  # collapse the tree to one copy each. Bump them alongside react/react-dom.
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - '@prisma/engines'
  - better-sqlite3
  - prisma
